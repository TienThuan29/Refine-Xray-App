services:
  # Redis
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - prm392-network
  
  # Ai Service Api
  clinisearch-api:
    image: tienthuan29/clinisearch-api:latest
    container_name: clinisearch-api
    ports:
      - "8000:8000"
    environment:
      - GOOGLE_API_KEY=
      - NCBI_EMAIL=
      - ANTHROPIC_API_KEY=
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - API_HOST=0.0.0.0
      - API_PORT=8000
    volumes:
      - model_cache:/app/.cache
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - prm392-network

volumes:
  model_cache:
  redis_data:

networks:
  prm392-network:
    driver: bridge